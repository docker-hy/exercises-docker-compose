name: project tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run project 2.3 (compose) tests
        run: bash tests/test_2_03_project_compose.sh

      - name: Run project 2.4 (redis) tests
        run: bash tests/test_2_04_project_redis.sh

      - name: Run project 2.6 (postgres) tests
        run: bash tests/test_2_06_project_postgres.sh

      - name: Run project 2.7 (bind mount) tests
        run: bash tests/test_2_07_project_bind_mount.sh

      - name: Run project 2.9 (nginx) tests
        run: bash tests/test_2_09_project_nginx.sh

      - name: Run project 2.10 (closed ports) tests
        run: bash tests/test_2_10_project_closed_ports.sh
